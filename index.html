<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRO 产品路线图追踪器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #F7F6F3; color: #2C2B28; min-height: 100vh; }

  .app { max-width: 1200px; margin: 0 auto; padding: 24px 20px 48px; }

  .header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
  .header-left h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; color: #1A1918; outline: none; border-radius: 6px; padding: 2px 6px; margin: -2px -6px; transition: background 0.15s; cursor: text; }
  .header-left h1:hover { background: #EEEDE9; }
  .header-left h1:focus { background: #EEEDE9; border-bottom: 2px dashed #5B4EE8; }
  .header-left p { font-size: 13px; color: #7C7B77; margin-top: 4px; }
  .header-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .summary-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
  .chip-done   { background: #D6F0E0; color: #176B3A; }
  .chip-wip    { background: #FFF0CC; color: #7A5100; }
  .chip-todo   { background: #E8E7E3; color: #4A4945; }
  .chip-risk   { background: #FDDDD8; color: #9B2315; }

  .btn {
    background: #5B4EE8; color: white; border: none; border-radius: 8px;
    padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: background 0.15s; white-space: nowrap;
  }
  .btn:hover { background: #4A3DD0; }
  .btn-outline {
    background: white; color: #5B4EE8; border: 1.5px solid #5B4EE8;
    border-radius: 8px; padding: 7px 14px; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: all 0.15s; white-space: nowrap;
  }
  .btn-outline:hover { background: #F0EEFF; }
  .btn-sm { padding: 5px 10px; font-size: 11px; border-radius: 6px; }
  .btn-danger { background: #F04A30; }
  .btn-danger:hover { background: #D93A20; }

  .timeline-controls { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .timeline-controls label { font-size: 12px; font-weight: 600; color: #7C7B77; }
  .timeline-controls input { width: 60px; padding: 4px 6px; border: 1.5px solid #E8E7E3; border-radius: 6px; font-size: 12px; font-family: inherit; text-align: center; }
  .timeline-controls input:focus { border-color: #5B4EE8; outline: none; }

  .timeline-wrap { position: relative; padding: 0 0 4px; overflow-x: auto; }
  .timeline-axis { display: flex; border-top: 2px solid #2C2B28; margin-bottom: 0; min-width: fit-content; }
  .month-col { flex: 1; min-width: 120px; position: relative; }
  .month-label { font-size: 13px; font-weight: 700; color: #2C2B28; padding: 8px 0 0; }
  .month-dot { width: 8px; height: 8px; background: #2C2B28; border-radius: 50%; position: absolute; top: -5px; left: 0; }

  .task-card {
    background: white;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 10px;
    cursor: grab;
    border: 1.5px solid transparent;
    transition: box-shadow 0.15s, transform 0.1s;
    position: relative;
    user-select: none;
  }
  .task-card:active { cursor: grabbing; }
  .task-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.10); transform: translateY(-1px); }
  .task-card.active { border-color: #5B4EE8; box-shadow: 0 0 0 3px rgba(91,78,232,0.12); }
  .task-card.dragging { opacity: 0.5; transform: scale(0.95); }
  .task-card.drag-over { border-color: #5B4EE8; background: #F8F7FF; border-style: dashed; }

  .card-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 5px; }
  .card-title { font-size: 13px; font-weight: 600; color: #1A1918; line-height: 1.35; }
  .card-sub { font-size: 11px; color: #7C7B77; margin-top: 3px; line-height: 1.4; }
  .card-notes { font-size: 10px; color: #A0A09A; margin-top: 5px; line-height: 1.4; font-style: italic; }
  .card-dep { font-size: 10px; color: #C07A00; margin-top: 3px; }
  .card-actions { position: absolute; top: 6px; right: 8px; display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
  .task-card:hover .card-actions { opacity: 1; }
  .card-actions button { background: none; border: none; cursor: pointer; font-size: 14px; padding: 2px 4px; border-radius: 4px; color: #7C7B77; }
  .card-actions button:hover { background: #EEEDE9; color: #F04A30; }

  .progress-wrap { margin-top: 8px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 10px; color: #7C7B77; margin-bottom: 3px; }
  .progress-bar { height: 5px; background: #EEEDE9; border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 99px; transition: width 0.3s; }

  .s-done .card-tag { color: #176B3A; }
  .s-done { border-left: 3px solid #33C06A; }
  .s-done .progress-fill { background: #33C06A; }

  .s-wip .card-tag { color: #7A5100; }
  .s-wip { border-left: 3px solid #F5A623; }
  .s-wip .progress-fill { background: #F5A623; }

  .s-todo .card-tag { color: #4A4945; }
  .s-todo { border-left: 3px solid #B5B4AF; }
  .s-todo .progress-fill { background: #B5B4AF; }

  .s-risk .card-tag { color: #9B2315; }
  .s-risk { border-left: 3px solid #F04A30; }
  .s-risk .progress-fill { background: #F04A30; }

  .risk-icon { display: inline-block; margin-left: 4px; color: #F04A30; font-size: 12px; }

  .detail-panel {
    background: white;
    border-radius: 14px;
    margin-top: 24px;
    border: 1.5px solid #5B4EE8;
    overflow: hidden;
    animation: slideIn 0.18s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .panel-header { background: #5B4EE8; color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
  .panel-header h2 { font-size: 16px; font-weight: 700; }
  .panel-header .close-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .panel-body { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .panel-section h3 { font-size: 12px; font-weight: 700; color: #7C7B77; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }

  .field-row { margin-bottom: 12px; }
  .field-label { font-size: 11px; color: #7C7B77; margin-bottom: 4px; }
  .field-value { font-size: 14px; color: #1A1918; font-weight: 500; }

  .form-input, .form-select, .form-textarea {
    width: 100%; border: 1.5px solid #E8E7E3; border-radius: 8px;
    padding: 8px 10px; font-size: 13px; font-family: inherit;
    color: #1A1918; background: #FAFAF8;
    transition: border-color 0.15s; outline: none;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: #5B4EE8; }
  .form-textarea { resize: vertical; min-height: 80px; }

  .save-btn {
    background: #5B4EE8; color: white; border: none; border-radius: 8px;
    padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: background 0.15s; margin-top: 8px;
  }
  .save-btn:hover { background: #4A3DD0; }

  .progress-control { display: flex; align-items: center; gap: 10px; }
  .progress-control input[type=range] { flex: 1; accent-color: #5B4EE8; }
  .progress-control span { font-size: 13px; font-weight: 600; color: #5B4EE8; min-width: 32px; }

  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .checkbox-row input[type=checkbox] { width: 16px; height: 16px; accent-color: #F04A30; }
  .checkbox-row label { font-size: 13px; color: #1A1918; cursor: pointer; }

  .grid-wrap { display: grid; gap: 0; margin-top: 16px; }
  .col-header { font-size: 11px; font-weight: 700; color: #9C9A93; text-transform: uppercase; letter-spacing: 0.8px; padding: 0 6px 10px; border-right: 1px dashed #E2E1DC; }
  .col-cards { padding: 0 6px; border-right: 1px dashed #E2E1DC; padding-bottom: 12px; min-height: 60px; }
  .col-cards:last-child, .col-header:last-child { border-right: none; }
  .col-cards.drag-hover { background: #F8F7FF; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1A1918; color: white; padding: 10px 20px; border-radius: 8px;
    font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none;
    transition: opacity 0.2s; z-index: 999;
  }
  .toast.show { opacity: 1; }

  /* Modal */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4); z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    animation: fadeIn 0.15s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: white; border-radius: 14px; width: 500px; max-width: 90vw;
    max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .modal-header {
    padding: 16px 20px; border-bottom: 1px solid #EEEDE9;
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-header h3 { font-size: 16px; font-weight: 700; }
  .modal-header .close-btn { background: none; border: none; cursor: pointer; font-size: 18px; color: #7C7B77; padding: 4px 8px; border-radius: 6px; }
  .modal-header .close-btn:hover { background: #EEEDE9; }
  .modal-body { padding: 20px; }
  .modal-body .field-row { margin-bottom: 14px; }
  .modal-body .field-label { display: block; margin-bottom: 4px; }

  .month-range { font-size: 11px; color: #A0A09A; margin-top: 2px; }

  @media (max-width: 640px) {
    .grid-wrap { grid-template-columns: repeat(2, 1fr); }
    .panel-body { grid-template-columns: 1fr; }
  }

  /* Export mode: hide interactive elements */
  .exporting .header-right,
  .exporting .timeline-controls,
  .exporting .card-actions,
  .exporting .modal-overlay,
  .exporting .toast,
  .exporting .detail-panel { display: none !important; }
  .exporting .header-left h1 { background: none !important; border-bottom: none !important; cursor: default; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-left">
      <h1 id="projectTitle" contenteditable="true" spellcheck="false" onblur="onTitleBlur()" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">MRO 产品路线图</h1>
    </div>
    <div class="header-right">
      <div class="summary-chips" id="summaryChips"></div>
      <button class="btn-outline" onclick="exportPNG()" title="导出为PNG图片">📷 导出PNG</button>
      <button class="btn-outline" onclick="exportPDF()" title="导出为PDF文件">📄 导出PDF</button>
      <button class="btn" onclick="openAddModal()">+ 新增产品模块</button>
    </div>
  </div>

  <div class="timeline-controls">
    <label>年份</label>
    <input type="number" id="yearInput" min="2020" max="2099" value="2025" onchange="updateTimeline()">
    <label>起始月</label>
    <input type="number" id="startMonthInput" min="1" max="12" value="6" onchange="updateTimeline()">
    <label>结束月</label>
    <input type="number" id="endMonthInput" min="1" max="12" value="11" onchange="updateTimeline()">
    <span class="month-range" id="monthRangeHint">(最大跨度12个月)</span>
    <button class="btn-outline" onclick="updateTimeline()">应用</button>
  </div>

  <div class="timeline-wrap">
    <div class="timeline-axis" id="axisBar"></div>
  </div>

  <div class="grid-wrap" id="cardsGrid"></div>

  <div class="detail-panel" id="detailPanel" style="display:none"></div>
</div>

<div class="toast" id="toast">已保存</div>

<!-- 新增/编辑模态框 -->
<div class="modal-overlay" id="modalOverlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 id="modalTitle">新增产品模块</h3>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field-row">
        <label class="field-label">产品模块名称 *</label>
        <input class="form-input" id="modalTitleInput" placeholder="输入产品模块名称">
      </div>
      <div class="field-row">
        <label class="field-label">模块说明</label>
        <input class="form-input" id="modalSubInput" placeholder="输入模块说明">
      </div>
      <div class="field-row">
        <label class="field-label">完成进度（拖动调整，与状态联动）</label>
        <div class="progress-control">
          <input type="range" min="0" max="100" value="0" id="modalProgress"
            oninput="onModalProgressChange()">
          <span id="modalProgressVal">0%</span>
        </div>
      </div>
      <div class="field-row">
        <label class="field-label">当前状态</label>
        <select class="form-select" id="modalStatus" onchange="onModalStatusChange()">
          <option value="todo">待开始</option>
          <option value="wip">进行中</option>
          <option value="done">已完成</option>
        </select>
      </div>
      <div class="field-row">
        <label class="field-label">备注</label>
        <textarea class="form-textarea" id="modalNotes" placeholder="记录备注信息..."></textarea>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="modalRisk">
        <label for="modalRisk">标记为有风险</label>
      </div>
      <div class="field-row">
        <label class="field-label">归属月份</label>
        <select class="form-select" id="modalMonth"></select>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="save-btn" id="modalSaveBtn" onclick="saveModal()" style="flex:1;">保存</button>
        <button class="btn btn-danger btn-sm" id="modalDeleteBtn" style="display:none;" onclick="deleteFromModal()">删除此模块</button>
      </div>
    </div>
  </div>
</div>

<script>
const MONTH_NAMES = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

let year = 2025;
let startMonth = 6; // 1-indexed
let endMonth = 11;
let months = ['6月','7月','8月','9月','10月','11月'];

const INIT_TASKS = [
  { id:'t1',  month:0, title:'打通工单补货流程',    sub:'补货能力',                         status:'done', progress:100, notes:'', risk:false, order:0 },
  { id:'t2',  month:1, title:'接入暂存柜暂存能力',   sub:'前置仓暂存能力',                   status:'done', progress:100, notes:'', risk:false, order:1 },
  { id:'t3',  month:1, title:'MRO管理系统标准化',   sub:'平云小匠、阿玛塔、东风汽车对接',    status:'wip',  progress:60,  notes:'', risk:false, order:2 },
  { id:'t4',  month:1, title:'接入顺丰寄件能力',    sub:'',                                 status:'wip',  progress:40,  notes:'', risk:false, order:3 },
  { id:'t5',  month:2, title:'MRO柜接入资产管理',   sub:'资产选址、资产激活等',              status:'todo', progress:15,  notes:'', risk:false, order:0 },
  { id:'t6',  month:2, title:'外部迪卡依对接',       sub:'',                                status:'risk', progress:10,  notes:'', risk:true,  order:1 },
  { id:'t7',  month:2, title:'MRO中台能力模块化',   sub:'存取能力',                         status:'todo', progress:20,  notes:'', risk:false, order:2 },
  { id:'t8',  month:3, title:'暂存柜柜机交互重构',   sub:'',                                status:'todo', progress:0,   notes:'', risk:false, order:0 },
  { id:'t9',  month:3, title:'客户关系管理',         sub:'',                                status:'todo', progress:0,   notes:'', risk:false, order:1 },
  { id:'t10', month:4, title:'丰巢管家App优化',      sub:'',                                status:'todo', progress:0,   notes:'', risk:false, order:0 },
  { id:'t11', month:4, title:'资金流水管理',          sub:'',                               status:'todo', progress:0,   notes:'', risk:false, order:1 },
  { id:'t12', month:5, title:'CRM商机管理',           sub:'',                               status:'todo', progress:0,   notes:'', risk:false, order:0 },
  { id:'t13', month:5, title:'丰蜜App优化',           sub:'',                               status:'todo', progress:0,   notes:'', risk:false, order:1 },
];

const STATUS_LABEL = { done:'已完成', wip:'进行中', todo:'待开始', risk:'有风险' };
const STATUS_CLASS = { done:'s-done', wip:'s-wip', todo:'s-todo', risk:'s-risk' };

let tasks = JSON.parse(localStorage.getItem('mro_tasks_v2') || 'null') || INIT_TASKS;
let activeId = null;
let editId = null; // for modal editing
let draggedTaskId = null;
let dragOverMonthIdx = null;
let dragOverOrderIdx = null;

function generateId() { return 't' + Date.now() + '_' + Math.random().toString(36).substr(2,6); }

function save() {
  try { localStorage.setItem('mro_tasks_v2', JSON.stringify(tasks)); } catch(e) {}
}

function onTitleBlur() {
  const el = document.getElementById('projectTitle');
  const name = el.textContent.trim() || 'MRO 产品路线图';
  if (!name) el.textContent = 'MRO 产品路线图';
  try { localStorage.setItem('mro_project_title', name); } catch(e) {}
  document.title = name;
}

function loadTitle() {
  const saved = localStorage.getItem('mro_project_title');
  if (saved) {
    document.getElementById('projectTitle').textContent = saved;
    document.title = saved;
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function getStatusFromProgress(progress) {
  if (progress >= 100) return 'done';
  if (progress > 0) return 'wip';
  return 'todo';
}

function getProgressFromStatus(status) {
  if (status === 'done') return 100;
  if (status === 'wip') return 50;
  return 0;
}

function computeMonths() {
  const m = [];
  for (let i = startMonth; i <= endMonth; i++) {
    m.push(MONTH_NAMES[i - 1]);
  }
  return m;
}

function updateTimeline() {
  const y = parseInt(document.getElementById('yearInput').value);
  const s = parseInt(document.getElementById('startMonthInput').value);
  const e = parseInt(document.getElementById('endMonthInput').value);
  if (isNaN(y) || isNaN(s) || isNaN(e) || s < 1 || s > 12 || e < 1 || e > 12 || s > e) {
    showToast('请输入有效的月份范围');
    return;
  }
  if (e - s > 11) {
    showToast('月份范围不能超过12个月（一年）');
    return;
  }
  year = y;
  startMonth = s;
  endMonth = e;
  months = computeMonths();
  // Reset tasks that fall outside range to first month
  const numMonths = months.length;
  tasks.forEach(t => { if (t.month >= numMonths) t.month = numMonths - 1; });
  save();
  renderAll();
}

function renderSummary() {
  const counts = { done:0, wip:0, todo:0, risk:0 };
  tasks.forEach(t => counts[t.status]++);
  document.getElementById('summaryChips').innerHTML = `
    <span class="chip chip-done">✓ 已完成 ${counts.done}</span>
    <span class="chip chip-wip">◐ 进行中 ${counts.wip}</span>
    <span class="chip chip-todo">○ 待开始 ${counts.todo}</span>
    <span class="chip chip-risk">! 有风险 ${counts.risk}</span>
  `;
}

function renderAxis() {
  document.getElementById('axisBar').innerHTML = months.map(m => `
    <div class="month-col">
      <div class="month-dot"></div>
      <div class="month-label">${m}</div>
    </div>
  `).join('');
}

function cardHTML(t) {
  const pct = t.progress || 0;
  const riskBadge = t.risk ? '<span class="risk-icon">⚠</span>' : '';
  return `
    <div class="task-card ${STATUS_CLASS[t.status]} ${activeId===t.id?'active':''}"
         id="card_${t.id}"
         draggable="true"
         ondragstart="onDragStart(event,'${t.id}')"
         ondragend="onDragEnd(event,'${t.id}')"
         ondragover="onDragOver(event,'${t.id}',${t.month},${t.order||0})"
         ondragleave="onDragLeave(event,'${t.id}')"
         ondrop="onDrop(event,'${t.id}',${t.month},${t.order||0})"
         onclick="openEditModal('${t.id}')">
      <div class="card-actions">
        <button onclick="event.stopPropagation();deleteTask('${t.id}')" title="删除">🗑</button>
      </div>
      <div class="card-tag">${STATUS_LABEL[t.status]}${riskBadge}</div>
      <div class="card-title">${t.title}</div>
      ${t.sub ? `<div class="card-sub">| ${t.sub}</div>` : ''}
      ${t.notes ? `<div class="card-notes">${t.notes}</div>` : ''}
      <div class="progress-wrap">
        <div class="progress-label"><span>进度</span><span>${pct}%</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
    </div>
  `;
}

function renderCards() {
  const numCols = months.length;
  const cols = Array.from({length: numCols}, () => []);
  tasks.forEach(t => {
    if (t.month >= numCols) t.month = numCols - 1;
    cols[t.month].push(t);
  });
  // Sort each column by order
  cols.forEach(col => col.sort((a,b) => (a.order||0) - (b.order||0)));
  document.getElementById('cardsGrid').style.gridTemplateColumns = `repeat(${numCols}, 1fr)`;
  document.getElementById('cardsGrid').innerHTML =
    cols.map((col, mi) => `
      <div>
        <div class="col-header">${months[mi]}</div>
        <div class="col-cards" id="col_${mi}"
             ondragover="onColDragOver(event,${mi})"
             ondragleave="onColDragLeave(event,${mi})"
             ondrop="onColDrop(event,${mi})">
          ${col.map(t => cardHTML(t)).join('')}
        </div>
      </div>
    `).join('');
}

function renderAll() {
  renderAxis();
  renderSummary();
  renderCards();
}

// ---------- Drag & Drop ----------
function onDragStart(e, id) {
  draggedTaskId = id;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
  const card = document.getElementById('card_' + id);
  if (card) card.classList.add('dragging');
}

function onDragEnd(e, id) {
  draggedTaskId = null;
  dragOverMonthIdx = null;
  dragOverOrderIdx = null;
  const card = document.getElementById('card_' + id);
  if (card) card.classList.remove('dragging');
  // Remove all drag-over highlights
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  document.querySelectorAll('.drag-hover').forEach(el => el.classList.remove('drag-hover'));
}

function onDragOver(e, id, monthIdx, orderIdx) {
  e.preventDefault();
  if (!draggedTaskId || draggedTaskId === id) return;
  e.dataTransfer.dropEffect = 'move';
  const card = document.getElementById('card_' + id);
  if (card) card.classList.add('drag-over');
  dragOverMonthIdx = monthIdx;
  dragOverOrderIdx = orderIdx;
}

function onDragLeave(e, id) {
  const card = document.getElementById('card_' + id);
  if (card) card.classList.remove('drag-over');
}

function onDrop(e, targetId, targetMonth, targetOrder) {
  e.preventDefault();
  if (!draggedTaskId || draggedTaskId === targetId) return;
  moveTask(draggedTaskId, targetMonth, targetOrder);
}

function onColDragOver(e, monthIdx) {
  e.preventDefault();
  if (!draggedTaskId) return;
  e.dataTransfer.dropEffect = 'move';
  const col = document.getElementById('col_' + monthIdx);
  if (col) col.classList.add('drag-hover');
  dragOverMonthIdx = monthIdx;
  dragOverOrderIdx = null;
}

function onColDragLeave(e, monthIdx) {
  const col = document.getElementById('col_' + monthIdx);
  if (col) col.classList.remove('drag-hover');
}

function onColDrop(e, monthIdx) {
  e.preventDefault();
  if (!draggedTaskId) return;
  const numCols = months.length;
  // Move to end of target column
  const colTasks = tasks.filter(t => t.month === monthIdx);
  const maxOrder = colTasks.length > 0 ? Math.max(...colTasks.map(t => t.order||0)) : -1;
  moveTaskToMonth(draggedTaskId, monthIdx, maxOrder + 1);
}

function moveTask(taskId, targetMonth, targetOrder) {
  const dragged = tasks.find(t => t.id === taskId);
  const target = tasks.find(t => t.id === draggedTaskId === taskId ? null : null);
  if (!dragged) return;

  const oldMonth = dragged.month;
  const oldOrder = dragged.order || 0;

  if (oldMonth === targetMonth) {
    // Same month - reorder
    const colTasks = tasks.filter(t => t.month === oldMonth && t.id !== taskId).sort((a,b) => (a.order||0)-(b.order||0));
    const allInCol = [dragged, ...colTasks].sort((a,b) => (a.order||0)-(b.order||0));
    // Remove dragged, insert at target position
    const others = allInCol.filter(t => t.id !== taskId);
    let insertIdx = 0;
    for (let i = 0; i < others.length; i++) {
      if ((others[i].order||0) < targetOrder) insertIdx = i + 1;
    }
    others.splice(insertIdx, 0, dragged);
    others.forEach((t, i) => { t.order = i; });
  } else {
    // Different month
    dragged.month = targetMonth;
    // Reorder target month
    const targetCol = tasks.filter(t => t.month === targetMonth).sort((a,b) => (a.order||0)-(b.order||0));
    targetCol.forEach((t, i) => { t.order = i; });
    // Reorder source month
    const sourceCol = tasks.filter(t => t.month === oldMonth && t.id !== taskId).sort((a,b) => (a.order||0)-(b.order||0));
    sourceCol.forEach((t, i) => { t.order = i; });
  }
  save();
  renderAll();
}

function moveTaskToMonth(taskId, newMonth, newOrder) {
  const dragged = tasks.find(t => t.id === taskId);
  if (!dragged) return;
  const oldMonth = dragged.month;
  dragged.month = newMonth;
  dragged.order = newOrder;

  // Reorder new month
  const newCol = tasks.filter(t => t.month === newMonth).sort((a,b) => (a.order||0)-(b.order||0));
  newCol.forEach((t, i) => { t.order = i; });

  // Reorder old month
  if (oldMonth !== newMonth) {
    const oldCol = tasks.filter(t => t.month === oldMonth).sort((a,b) => (a.order||0)-(b.order||0));
    oldCol.forEach((t, i) => { t.order = i; });
  }
  save();
  renderAll();
}

// ---------- Modal ----------
function openAddModal() {
  editId = null;
  document.getElementById('modalTitle').textContent = '新增产品模块';
  document.getElementById('modalTitleInput').value = '';
  document.getElementById('modalSubInput').value = '';
  document.getElementById('modalProgress').value = 0;
  document.getElementById('modalProgressVal').textContent = '0%';
  document.getElementById('modalStatus').value = 'todo';
  document.getElementById('modalNotes').value = '';
  document.getElementById('modalRisk').checked = false;
  document.getElementById('modalDeleteBtn').style.display = 'none';
  document.getElementById('modalSaveBtn').textContent = '保存';
  populateMonthSelect(0);
  document.getElementById('modalOverlay').style.display = 'flex';
}

function openEditModal(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  editId = id;
  activeId = id;
  document.getElementById('modalTitle').textContent = '编辑产品模块';
  document.getElementById('modalTitleInput').value = t.title;
  document.getElementById('modalSubInput').value = t.sub || '';
  document.getElementById('modalProgress').value = t.progress;
  document.getElementById('modalProgressVal').textContent = t.progress + '%';
  document.getElementById('modalStatus').value = (t.status === 'risk') ? 'wip' : t.status;
  document.getElementById('modalNotes').value = t.notes || '';
  document.getElementById('modalRisk').checked = t.risk;
  document.getElementById('modalDeleteBtn').style.display = 'inline-block';
  document.getElementById('modalSaveBtn').textContent = '保存修改';
  populateMonthSelect(t.month);
  document.getElementById('modalOverlay').style.display = 'flex';
  renderCards();
}

function closeModal() {
  document.getElementById('modalOverlay').style.display = 'none';
  editId = null;
  activeId = null;
  renderCards();
}

function populateMonthSelect(selectedMonth) {
  const sel = document.getElementById('modalMonth');
  sel.innerHTML = months.map((m, i) => `<option value="${i}" ${i===selectedMonth?'selected':''}>${m}</option>`).join('');
}

function onModalProgressChange() {
  const val = parseInt(document.getElementById('modalProgress').value);
  document.getElementById('modalProgressVal').textContent = val + '%';
  // Auto-sync status with progress
  if (val >= 100) {
    document.getElementById('modalStatus').value = 'done';
  } else if (val > 0) {
    document.getElementById('modalStatus').value = 'wip';
  } else {
    document.getElementById('modalStatus').value = 'todo';
  }
}

function onModalStatusChange() {
  const status = document.getElementById('modalStatus').value;
  const progress = getProgressFromStatus(status);
  document.getElementById('modalProgress').value = progress;
  document.getElementById('modalProgressVal').textContent = progress + '%';
}

function saveModal() {
  const title = document.getElementById('modalTitleInput').value.trim();
  if (!title) { showToast('请输入产品模块名称'); return; }

  const sub = document.getElementById('modalSubInput').value.trim();
  const progress = parseInt(document.getElementById('modalProgress').value);
  const statusFromSelect = document.getElementById('modalStatus').value;
  const notes = document.getElementById('modalNotes').value.trim();
  const risk = document.getElementById('modalRisk').checked;
  const month = parseInt(document.getElementById('modalMonth').value);

  // Determine status: risk overrides if checked
  let status = statusFromSelect;
  if (risk) status = 'risk';
  // Sync progress with status
  let finalProgress = progress;
  if (status === 'done') finalProgress = 100;
  else if (status === 'todo' && finalProgress > 0) finalProgress = 0;

  if (editId) {
    // Update existing
    const t = tasks.find(x => x.id === editId);
    if (t) {
      t.title = title;
      t.sub = sub;
      t.progress = finalProgress;
      t.status = status;
      t.notes = notes;
      t.risk = risk;
      t.month = month;
    }
  } else {
    // Create new
    const numCols = months.length;
    const safeMonth = Math.min(month, numCols - 1);
    const colTasks = tasks.filter(t => t.month === safeMonth);
    const maxOrder = colTasks.length > 0 ? Math.max(...colTasks.map(t => t.order||0)) : -1;
    tasks.push({
      id: generateId(),
      month: safeMonth,
      title: title,
      sub: sub,
      status: status,
      progress: finalProgress,
      notes: notes,
      risk: risk,
      order: maxOrder + 1
    });
  }

  save();
  showToast(editId ? '✓ 已保存' : '✓ 已新增');
  editId = null;
  activeId = null;
  closeModal();
  renderAll();
}

function deleteFromModal() {
  if (!editId) return;
  if (!confirm('确定要删除此产品模块吗？此操作不可撤销。')) return;
  tasks = tasks.filter(t => t.id !== editId);
  save();
  showToast('✓ 已删除');
  editId = null;
  activeId = null;
  closeModal();
  renderAll();
}

function deleteTask(id) {
  if (!confirm('确定要删除此产品模块吗？')) return;
  tasks = tasks.filter(t => t.id !== id);
  if (activeId === id) activeId = null;
  save();
  showToast('✓ 已删除');
  renderAll();
}

// ---------- Export ----------
async function exportPNG() {
  showToast('正在生成 PNG 图片...');
  const app = document.querySelector('.app');
  app.classList.add('exporting');

  // Hide modal overlay if open
  const modal = document.getElementById('modalOverlay');
  const modalWasVisible = modal.style.display === 'flex';
  if (modalWasVisible) modal.style.display = 'none';

  try {
    const canvas = await html2canvas(app, {
      backgroundColor: '#F7F6F3',
      scale: 2,
      useCORS: true,
      logging: false
    });

    // Create download link
    const link = document.createElement('a');
    const projectName = document.getElementById('projectTitle').textContent.trim() || '产品路线图';
    link.download = `${projectName}_${year}年${months[0]}-${months[months.length-1]}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('✓ PNG 已导出');
  } catch(e) {
    showToast('导出失败，请重试');
    console.error(e);
  }

  app.classList.remove('exporting');
  if (modalWasVisible) modal.style.display = 'flex';
}

async function exportPDF() {
  showToast('正在生成 PDF 文件...');
  const app = document.querySelector('.app');
  app.classList.add('exporting');

  const modal = document.getElementById('modalOverlay');
  const modalWasVisible = modal.style.display === 'flex';
  if (modalWasVisible) modal.style.display = 'none';

  try {
    const canvas = await html2canvas(app, {
      backgroundColor: '#F7F6F3',
      scale: 2,
      useCORS: true,
      logging: false
    });

    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;

    // A4 landscape for better timeline display
    const pdfWidth = 297; // mm
    const pdfHeight = 210; // mm

    const imgRatio = canvas.height / canvas.width;
    let imgWidth = pdfWidth - 20; // 10mm margins
    let imgHeight = imgWidth * imgRatio;

    // If too tall, scale to fit
    if (imgHeight > pdfHeight - 30) {
      imgHeight = pdfHeight - 30;
      imgWidth = imgHeight / imgRatio;
    }

    const x = (pdfWidth - imgWidth) / 2;
    const y = 15;

    const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

    // Decorative header bar
    pdf.setFillColor(91, 78, 232); // #5B4EE8
    pdf.rect(0, 0, pdfWidth, 6, 'F');

    // Footer line
    pdf.setFillColor(91, 78, 232);
    pdf.rect(0, pdfHeight - 6, pdfWidth, 6, 'F');

    // Add image
    pdf.addImage(imgData, 'PNG', x, y, imgWidth, imgHeight);

    // Footer text
    pdf.setFontSize(7);
    pdf.setTextColor(150, 150, 150);
    const projectName = document.getElementById('projectTitle').textContent.trim() || '产品路线图';
    pdf.text(`Generated: ${new Date().toLocaleDateString('zh-CN')} | ${projectName}`, 10, pdfHeight - 10);

    pdf.save(`${projectName}_${year}年${months[0]}-${months[months.length-1]}.pdf`);
    showToast('✓ PDF 已导出');
  } catch(e) {
    showToast('导出失败，请重试');
    console.error(e);
  }

  app.classList.remove('exporting');
  if (modalWasVisible) modal.style.display = 'flex';
}
